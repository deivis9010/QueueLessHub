name: PR Validation - Strict

on:
  pull_request:
    branches:
      - main

jobs:
  strict-validation:
    name: Strict Validation for Main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: ✅ TypeScript strict mode check
        run: npm run check
        continue-on-error: false

      - name: 🎨 Prettier format check (no changes allowed)
        run: npm run format:check
        continue-on-error: false

      - name: 🔍 ESLint linting (strict, 0 warnings)
        run: npm run lint
        continue-on-error: false

      - name: 🧪 Run all tests
        run: npm test -- --maxWorkers=1 --coverage --bail
        continue-on-error: false

      - name: 📊 Verify coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          npm run test:coverage 2>&1 | grep -E "(Statements|Branches|Functions|Lines)"
        continue-on-error: false

      - name: 🎯 Build verification
        run: npm run build
        continue-on-error: false

      - name: ✨ All checks passed
        if: success()
        run: echo "✅ All strict validations passed - Ready to merge"

      - name: ❌ Checks failed
        if: failure()
        run: |
          echo "❌ Strict validation failed - Please fix errors before merge"
          exit 1
